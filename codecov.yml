# Coverage flags:
# - `julia` — CPU-reachable slice (ubuntu-latest), including host-side kernels
#   extracted from `_step_impl!` / STDP / ensemble (see issue #55)
# - `julia-gpu` — reservoir dynamics from the self-hosted GPU runner (#68)
#
# Reports merge: project `auto` and patch status are both enforced.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: auto
        threshold: 5%
