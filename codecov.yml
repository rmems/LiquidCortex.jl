# Coverage flags:
# - `julia` — CPU-reachable slice (ubuntu-latest), including host-side kernels
#   extracted from `_step_impl!` / STDP / ensemble (see issue #55)
# - `julia-gpu` — reservoir dynamics from the self-hosted GPU runner (#68)
#
# Project uses `auto` so a drop relative to the base is a real regression.
# Patch target is the extracted host kernels plus any GPU-flagged lines.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 50%
