name: Feature request
description: Propose a change to LiquidCortex.jl
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete API or behavior change. Note if it is breaking under 0.x semver.
    validations:
      required: true
