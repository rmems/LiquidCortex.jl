name: Sentry Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sentry-release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: limen-neural
      SENTRY_PROJECT: liquidcortex

    steps:
      - name: Skip when Sentry auth token is not configured
        if: ${{ env.SENTRY_AUTH_TOKEN == '' }}
        run: |
          echo "⚠ SENTRY_AUTH_TOKEN is not configured."
          echo "  For CI: add SENTRY_AUTH_TOKEN to GitHub Secrets."
          echo "  For local: copy .env.example to .env and fill in your token."
          echo "Skipping Sentry release creation."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned sentry-cli
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_CLI_VERSION: "3.4.0"
        run: |
          set -euo pipefail
          asset_name="sentry-cli-Linux-x86_64"
          asset_url="https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/${asset_name}"
          # SHA-256 for sentry-cli 3.4.0 Linux x86_64 (pin in-repo; do not fetch from release-registry)
          expected_sha256="803556dd09de4fe54639c4d2e696315fd5a67dda3f8fe8dfe52a942ead5a2ae1"
          curl -fsSL "$asset_url" -o sentry-cli
          echo "${expected_sha256}  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          sudo mv sentry-cli /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Create Sentry Release
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          VERSION="liquidcortex@$(git rev-parse --short HEAD)"
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits --auto "$VERSION"
          sentry-cli releases finalize "$VERSION"
