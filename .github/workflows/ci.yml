name: CI (Julia)

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-julia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  test:
    name: Julia 1.13.2 (channel ${{ matrix.julia-version }}) — CPU smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.13']
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      # Channel 1.13. Reject 1.13.0; accept 1.13.2 and later 1.13 patches.
      - name: Require Julia 1.13.2 or newer 1.13
        run: julia -e 'v"1.13.2" <= VERSION < v"1.14" || error("expected Julia 1.13.2 or a newer 1.13 patch, got $VERSION")'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - name: Pin CI Manifest
        run: cp .github/ci-manifest/Manifest.toml Manifest.toml

      # CompatHelper / Dependabot edit Project.toml but not this lockfile.
      # Re-resolve so those PRs actually exercise the new [compat] bounds.
      - name: Refresh lockfile on dependency-bot PRs
        if: >
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'compathelper/') ||
           startsWith(github.head_ref, 'dependabot/'))
        run: julia --project=. -e 'using Pkg; Pkg.update()'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      # Coverage is collected on Ubuntu so the suite is not executed twice.
      # windows-latest is the CUDA-unavailable CPU path (see issue #64).
      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'

      - name: Run tests
        if: runner.os == 'Windows'
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Process coverage
        if: runner.os == 'Linux'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
        with:
          directories: src

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
