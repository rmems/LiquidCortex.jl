name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

concurrency:
  group: tagbot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SSH so the tag push can trigger documentation.yml (GITHUB_TOKEN
          # events do not start new workflows). Same deploy key as Documenter.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
