name: GPU CI (self-hosted)

# Runs Julia package tests on whichever self-hosted GPU runner is available:
#   Linux:   self-hosted, Linux, X64, gpu        (ShipOfTheseus / wsl-liquidcortex)
#   Windows: self-hosted, Windows, X64, liquidcortex (DESKTOP-4E1V5HV-liquidcortex)
# pick-gpu-runner uses the Actions runs/jobs APIs (actions:read) plus the
# gpu-runner-canary heartbeat. It never calls the admin-only runners list API,
# so GITHUB_TOKEN cannot leak runner inventory and an offline host skips this
# workflow instead of leaving a self-hosted job queued for 24 hours.
#
# Security: never run untrusted fork PR code on the persistent self-hosted host
# (GitHub recommendation). Same-repo PRs, pushes, and manual dispatch only.
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

# Serialize per-ref so an unrelated PR does not cancel main/release GPU jobs.
# Do not cancel main/release pushes — only cancel superseded PR runs.
concurrency:
  group: liquidcortex-gpu-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  pick-gpu-runner:
    name: Select GPU host
    # Fork PRs: skip before checkout so untrusted code never reaches a runner.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Only the picker reads Actions metadata; GPU jobs get contents:read.
    permissions:
      contents: read
      actions: read
    outputs:
      target: ${{ steps.pick.outputs.target }}
      reason: ${{ steps.pick.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick available self-hosted GPU runner
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pick-gpu-runner.sh

  gpu-test-linux:
    name: Julia 1.13.2 — GPU tests (Linux self-hosted)
    needs: pick-gpu-runner
    if: needs.pick-gpu-runner.outputs.target == 'linux'
    runs-on: [self-hosted, Linux, X64, gpu]
    timeout-minutes: 60

    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify host toolchain
        run: |
          set -euo pipefail
          command -v julia
          julia --version
          # Self-hosted Julia is host-managed; accept the 1.13 line at or above
          # the pinned CI patch so a host patch bump does not break the check.
          julia -e 'v"1.13.2" <= VERSION < v"1.14" || error("expected Julia 1.13.2 or a newer 1.13 patch, got $VERSION")'
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader

      - name: Pin CI Manifest
        run: cp .github/ci-manifest/Manifest.toml Manifest.toml

      # CompatHelper / Dependabot edit Project.toml but not this lockfile.
      # Re-resolve so those PRs actually exercise the new [compat] bounds.
      - name: Refresh lockfile on dependency-bot PRs
        if: >
          github.event_name == 'pull_request' &&
          (github.actor == 'dependabot[bot]' ||
           startsWith(github.head_ref, 'compathelper/') ||
           startsWith(github.head_ref, 'dependabot/'))
        run: julia --project=. -e 'using Pkg; Pkg.update()'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Verify CUDA.jl in project
        run: |
          set -euo pipefail
          julia --project=. -e '
            using CUDA
            @assert CUDA.functional() "CUDA.jl reports non-functional device"
            println(CUDA.name(CUDA.device()))
          '

      - name: Run tests (CPU + GPU)
        id: tests
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'

      - name: Reclaim GPU memory
        if: always()
        run: |
          julia --project=. -e '
            using CUDA
            if CUDA.functional()
              CUDA.synchronize()
              GC.gc(true)
              CUDA.reclaim()
              free = CUDA.free_memory() / 1e9
              total = CUDA.total_memory() / 1e9
              println("VRAM free/total GB: ", round(free; digits=2), " / ", round(total; digits=2))
            end
          '

      # GPU coverage is the slice ubuntu-latest cannot see (see issue #55).
      # Gate on the test step, not job success(), so a reclaim failure still uploads.
      - name: Process coverage
        if: always() && steps.tests.outcome == 'success'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
        with:
          directories: src

      - name: Upload coverage to Codecov
        if: always() && steps.tests.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: julia-gpu
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Remove coverage artifacts
        if: always()
        run: |
          set -euo pipefail
          find src test -name '*.cov' -delete
          rm -f lcov.info

  gpu-test-windows:
    name: Julia 1.13.2 — GPU tests (Windows self-hosted)
    needs: pick-gpu-runner
    if: needs.pick-gpu-runner.outputs.target == 'windows'
    runs-on: [self-hosted, Windows, X64, liquidcortex]
    timeout-minutes: 120

    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "1"

    # This host's LocalMachine execution policy is Restricted and pwsh is not
    # installed by default. Bootstrap PowerShell 7 with Windows PowerShell 5.1
    # (-ExecutionPolicy Bypass), then run the remaining steps through pwsh.
    defaults:
      run:
        shell: 'pwsh -NoProfile -ExecutionPolicy Bypass -File "{0}"'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure PowerShell 7
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"'
        run: |
          & .\.github\scripts\ensure-pwsh.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Julia 1.13.2 with juliaup
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & .\.github\scripts\install-juliaup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin CI Manifest
        run: Copy-Item -LiteralPath .github/ci-manifest/Manifest.toml -Destination Manifest.toml -Force

      # CompatHelper / Dependabot edit Project.toml but not this lockfile.
      # Re-resolve so those PRs actually exercise the new [compat] bounds.
      - name: Refresh lockfile on dependency-bot PRs
        if: >
          github.event_name == 'pull_request' &&
          (github.actor == 'dependabot[bot]' ||
           startsWith(github.head_ref, 'compathelper/') ||
           startsWith(github.head_ref, 'dependabot/'))
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & julia --pkgimages=no --project=. -e 'using Pkg; Pkg.update()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instantiate
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CUDA.jl in project
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & julia --pkgimages=no --project=. -e @'
          using CUDA
          @assert CUDA.functional() "CUDA.jl reports non-functional device"
          println(CUDA.name(CUDA.device()))
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests (CPU + GPU)
        id: tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Application Control blocks Julia's native pkgimage cache on this
          # host, so the test subprocess must also run with --pkgimages=no.
          & julia --pkgimages=no --project=. -e 'using Pkg; Pkg.test(; coverage=true, julia_args=["--pkgimages=no"])'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reclaim GPU memory
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & julia --pkgimages=no --project=. -e @'
          using CUDA
          if CUDA.functional()
              CUDA.synchronize()
              GC.gc(true)
              CUDA.reclaim()
              free = CUDA.free_memory() / 1e9
              total = CUDA.total_memory() / 1e9
              println("VRAM free/total GB: ", round(free; digits=2), " / ", round(total; digits=2))
          end
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same GPU coverage slice as the Linux job (issue #55). The
      # julia-processcoverage composite action runs plain `julia`, which this
      # host's Application Control policy blocks via pkgimages, so process
      # coverage through the repo script with --pkgimages=no instead.
      - name: Process coverage
        if: always() && steps.tests.outcome == 'success'
        env:
          COVERAGE_DIRECTORIES: src
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & julia --pkgimages=no .github/scripts/process-coverage.jl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage to Codecov
        if: always() && steps.tests.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: julia-gpu
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Remove coverage artifacts
        if: always()
        run: |
          Get-ChildItem -Path src, test -Recurse -Filter '*.cov' -File -ErrorAction SilentlyContinue |
              Remove-Item -Force
          Remove-Item -LiteralPath lcov.info -Force -ErrorAction SilentlyContinue

  gpu-skip:
    name: GPU tests skipped (no runner online)
    needs: pick-gpu-runner
    if: needs.pick-gpu-runner.outputs.target == 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        env:
          PICK_REASON: ${{ needs.pick-gpu-runner.outputs.reason }}
        run: |
          echo "No idle self-hosted GPU runner (${PICK_REASON})."
          echo "Linux gpu and Windows liquidcortex were unavailable; not queuing."
