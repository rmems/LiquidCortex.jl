# Machine Interoception Benchmark v1 — example configuration (tiny synthetic fixture).
# Run from the repo root:
#   julia --project=. examples/interoception/replay.jl --config examples/interoception/config.example.toml --out result.json
# Paths are relative to this file.

seed = 1234

[dataset]
dir = "fixtures"                 # one CSV per session; file stem = session id
time_column = "t_ms"
required_features = ["gpu_temp_c", "vram_used_pct", "gpu_power_w", "throttle_active"]
jitter_tol = 0.25                # relative gap tolerance; larger gaps are an error

# Optional explicit renames for exports with other column names (source = "canonical"), e.g. the
# rmems/gaming-telemetry canonical CSV (also set time_column = "timestamp_ms"):
# [dataset.column_map]
# cpu_tctl_c = "cpu_temp_c"
# cpu_package_power_w = "cpu_power_w"

[split]                          # by session, never by row. Omit all three for a deterministic hash split.
train = ["s01", "s02", "s03"]
val = ["s04"]
test = ["s05", "s06"]

[timebase]
replay_dt_ms = 100               # one model step == one replay interval
upsample = "error"               # "error" | "hold" (zero-order hold when replay is faster than the source)
tau_mode = "relative_ticks"      # "relative_ticks" | "literal_ms" (see docs/machine-interoception.md)

[task]
horizons_ms = [100, 500, 1000, 5000]   # horizons that are not a multiple of replay_dt_ms are skipped and listed
targets = ["gpu_temp_c", "vram_used_pct", "gpu_power_w", "throttle_active"]
class_horizon_ms = 500
warmup_steps = 20
lead_lookback_ms = 10000

[policy]                         # offline deterministic supervisor labels (evaluation only)
warn_temp_c = 80.0
throttle_temp_c = 85.0
pause_temp_c = 90.0
warn_vram_pct = 90.0
throttle_vram_pct = 95.0
pause_vram_pct = 98.0

[baselines]
ridge_lambdas = [1e-4, 1e-3, 1e-2, 1e-1, 1.0]
mlp_hidden = 32
mlp_epochs = 300
mlp_lr = 0.01

[reservoir]
N = 256                          # neurons per lobe (the package default of 65_536 needs >= 14 GB VRAM)
conn_prob = 0.05
spectral_radius = 0.9
sigma = 2.0
hist_depth = 4
input_gain = 4.0
readout_neurons = 128            # fixed seeded subset per lobe
features = ["membrane", "trace"]
taus = [10.0, 25.0, 50.0, 100.0] # interpreted per [timebase] tau_mode
weights = [0.4, 0.3, 0.2, 0.1]
single_tau = 25.0
readout_lambdas = [1e-3, 1e-2, 1e-1, 1.0, 10.0]

[experiments]
B = true                         # reflex-gated online readout
C = false                        # recurrent pair-STDP ablation (run only after A/B reproduce)

[reflex]
temp_lo_c = 70.0
temp_hi_c = 90.0
vram_lo_pct = 80.0
vram_hi_pct = 98.0
gain = 4.0
online_lr = 0.05
